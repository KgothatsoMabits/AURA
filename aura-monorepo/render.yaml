# Render Blueprint for Project Aura.
# Uses the existing Supabase PostgreSQL database; no Render database is created.
# Set DATABASE_URL to your Supabase connection string in the Render dashboard.
# Keep VITE_API_URL aligned with the actual deployed backend URL.

services:
  - type: web
    name: aura-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: aura-monorepo/backend-api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ID_ENC_KEY
        sync: false
      - key: ID_HASH_PEPPER
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: DEMO_ACCESS_KEY
        sync: false
      - key: DEMO_ACCOUNT_PHONES
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://aura-citizen-web.onrender.com,https://aura-responder-console.onrender.com,https://localhost,capacitor://localhost
      - key: SMS_PROVIDER
        value: vendel
      - key: VENDEL_API_KEY
        sync: false
      - key: VENDEL_BASE_URL
        value: https://app.vendel.cc
      - key: NOTIFY_CONTACTS_ON_CREATE
        value: "false"
      - key: GUARDIAN_ALERTS_ENABLED
        value: "false"
      - key: GUARDIAN_DEFAULT_RADIUS_M
        value: "1000"
      - key: GUARDIAN_PRESENCE_TTL_MIN
        value: "30"
      - key: GUARDIAN_MAX_RECIPIENTS
        value: "25"
      - key: GUARDIAN_MAX_ALERTS_PER_HOUR
        value: "3"
      - key: VICTIM_MAX_NEARBY_PER_HOUR
        value: "2"
      - key: GUARDIAN_GRID_M
        value: "250"
      - key: PUSH_PROVIDER
        value: console
      - key: RETENTION_DAYS_LOCATIONS
        value: "90"

  - type: web
    name: aura-citizen-web
    runtime: static
    rootDir: aura-monorepo
    buildCommand: npm ci --prefix frontend-webapp && npm --prefix frontend-webapp run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://aura-api-ykdg.onrender.com/api/v1
      - key: VITE_TILE_URL
        value: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: aura-responder-console
    runtime: static
    rootDir: aura-monorepo
    buildCommand: npm ci --prefix responder-console && npm --prefix responder-console run build
    staticPublishPath: ./responder-console/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://aura-api-ykdg.onrender.com/api/v1
      - key: VITE_DEMO_LOGIN_ENABLED
        value: "true"
      - key: VITE_TILE_URL
        value: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
    routes:
      - type: rewrite
        source: /*
        destination: /index.html